services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    network_mode: host
    env_file:
      - ${STELLAR_MAINNET_ENV_FILE:-backend/.env.mainnet}
    command: ["node", "--import", "tsx", "backend/db/runMigrations.ts"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    init: true
    restart: unless-stopped
    network_mode: host
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${STELLAR_MAINNET_ENV_FILE:-backend/.env.mainnet}
    environment:
      NODE_ENV: production
      BACKEND_HOST: 0.0.0.0
      PORT: 8787
      MOBILE_AUTH_PROTOTYPE_ONLY: "false"
      STELLAR_INTEGRITY_SIGNER_SECRET: ""
      STELLAR_INTEGRITY_SIGNER_SECRET_FILE: ""
      STELLAR_INTEGRITY_SIGNER_TOKEN_FILE: /run/secrets/stellar-signer-token
      STELLAR_INTEGRITY_FEE_PAYER_SECRET: ""
      STELLAR_INTEGRITY_FEE_PAYER_SECRET_FILE: /run/secrets/stellar-fee-payer-secret
      STELLAR_INTEGRITY_ALERT_WEBHOOK_TOKEN: ""
      STELLAR_INTEGRITY_ALERT_WEBHOOK_TOKEN_FILE: /run/secrets/stellar-alert-token
      STELLAR_INTEGRITY_ARCHIVE_WEBHOOK_TOKEN: ""
      STELLAR_INTEGRITY_ARCHIVE_WEBHOOK_TOKEN_FILE: /run/secrets/stellar-archive-token
    secrets:
      - stellar-signer-token
      - stellar-alert-token
      - stellar-fee-payer-secret
      - stellar-archive-token
    volumes:
      - uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

secrets:
  stellar-signer-token:
    file: ${STELLAR_SIGNER_TOKEN_HOST_FILE}
  stellar-alert-token:
    file: ${STELLAR_ALERT_TOKEN_HOST_FILE}
  stellar-fee-payer-secret:
    file: ${STELLAR_FEE_PAYER_SECRET_HOST_FILE}
  stellar-archive-token:
    file: ${STELLAR_ARCHIVE_TOKEN_HOST_FILE}

volumes:
  uploads:
