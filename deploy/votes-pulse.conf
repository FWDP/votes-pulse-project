# ==============================================================================
# Nginx Virtual Host Configuration for VOTES-PULSE
# Domains: votes-pulse.local, votes-pulse.localhost
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name votes-pulse.local votes-pulse.localhost;

    # Static production build root
    root /home/peej/Documents/Work/FWDP/votes-pulse/dist;
    index index.html;

    # Security headers & tokens
    server_tokens off;
    client_max_body_size 20m;

    # SPA Routing: Fallback all client routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Backend Reverse Proxy (Express / tsx backend)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Static Assets Caching (JS, CSS, SVGs, Fonts)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deny access to sensitive files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Logging
    access_log /var/log/nginx/votes-pulse.access.log;
    error_log  /var/log/nginx/votes-pulse.error.log warn;
}

