# ==============================================================================
# Nginx Virtual Host Configuration for VOTES
# Domain: votes.local
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name votes.local;

    root /opt/votes/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/votes.access.log;
    error_log  /var/log/nginx/votes.error.log warn;
}
