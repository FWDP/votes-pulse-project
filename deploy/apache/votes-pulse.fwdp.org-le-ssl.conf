<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName votes-pulse.fwdp.org
    DocumentRoot /var/www/html/votes-pulse-project/dist

    <Directory /var/www/html/votes-pulse-project/dist>
        Options FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api(?:/|$)
        RewriteCond %{REQUEST_URI} !^/assets(?:/|$)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [END]
    </Directory>

    <Files "index.html">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </Files>

    <Directory /var/www/html/votes-pulse-project/dist/assets>
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8787/api
    ProxyPassReverse /api http://127.0.0.1:8787/api

    ErrorLog ${APACHE_LOG_DIR}/votes-pulse-error.log
    CustomLog ${APACHE_LOG_DIR}/votes-pulse-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/votes-pulse.fwdp.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/votes-pulse.fwdp.org/privkey.pem
</VirtualHost>
</IfModule>
